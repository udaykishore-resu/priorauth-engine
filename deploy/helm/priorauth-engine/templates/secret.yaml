# Secrets are external by design: this chart never renders credentials.
# Create the referenced Secret out of band, e.g. with External Secrets:
#
#   kubectl create secret generic {{ .Values.existingSecret }} \
#     --from-literal=PA_POSTGRES_DSN='postgres://user:pass@host:5432/priorauth?sslmode=require'
#
# Optional keys: PA_LLM_BASE_URL, PA_LLM_API_KEY, PA_LLM_MODEL.
{{- if not .Values.existingSecret }}
{{- fail "existingSecret must name a Secret containing PA_POSTGRES_DSN" }}
{{- end }}
